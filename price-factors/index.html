<style>
/* Layout: one form column on limewash, items parted by hairlines like the site's calculator, a sticky bar at the

:root {
  --bg: #F3F2EE; --field: #FFFFFF; --fg: #141412; --muted: #625E57;

  --font-display: "Jost", "Futura", "Avenir Next", Arial, sans-serif;
  --font-body: "Golos Text", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --field: #1E1D1A; --fg: #F3F2EE; --muted: #A6A298;
    --rule: rgba(243, 242, 238, .16); --rule-strong: rgba(243, 242, 238, .55);
    --accent: #D19470; --pressed-bg: #F3F2EE; --pressed-fg: #141412; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --field: #1E1D1A; --fg: #F3F2EE; --muted: #A6A298;
  --rule: rgba(243, 242, 238, .16); --rule-strong: rgba(243, 242, 238, .55);
  --accent: #D19470; --pressed-bg: #F3F2EE; --pressed-fg: #141412; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 40px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { display: grid; gap: 14px; padding-bottom: 28px; }
.eyebrow { margin: 0; font: 500 12px/1.3 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 400 clamp(32px, 7vw, 46px)/1.04 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.lead { margin: 0; font-size: 17px; max-width: 62ch; }
.howto { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
.lang { display: flex; flex-wrap: wrap; gap: 8px; }
.banner { margin: 0; padding: 12px 14px; border: 1px solid var(--accent); color: var(--fg); font-size: 15px; }
h2 { margin: 0; padding-top: 36px; font: 400 clamp(24px, 4.6vw, 30px)/1.15 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.section-sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
.item { display: grid; gap: 16px; padding-block: 26px; border-top: 1px solid var(--rule); }
.section-head + .item { margin-top: 18px; }
.item h3 { margin: 0; font: 500 21px/1.25 var(--font-display); }
.num { font: 500 13px/1 var(--font-mono); color: var(--muted); margin-right: .55em; }
.opts { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.base { display: inline-block; margin-left: 6px; padding: 1px 6px; border: 1px solid var(--rule-strong); font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.q { display: grid; gap: 8px; }
.q__label { font-size: 15px; font-weight: 500; }
.seg, .checks { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: inherit; }
.seg button, .lang button {
  min-height: 44px; padding: 0 18px; border: 1px solid var(--rule-strong); background: var(--field); color: var(--fg);
  font: 500 15px/1 var(--font-body); cursor: pointer; transition: background-color .15s, color .15s;
}
.seg button[aria-pressed="true"], .lang button[aria-pressed="true"] { background: var(--pressed-bg); color: var(--pressed-fg); border-color: var(--pressed-bg); }
/* a tick box: the option it names, in a chip the whole width of a finger */
.check { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px 0 12px; border: 1px solid var(--rule-strong); background: var(--field); font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: pointer; flex: none; }
.check:has(input:checked) { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.check:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.check input:focus-visible { outline: none; }
.check .base { margin-left: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span:first-child { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.box { display: flex; align-items: stretch; border: 1px solid var(--rule-strong); background: var(--field); min-width: 0; }
.box input { flex: 1; min-width: 0; height: 46px; padding: 0 12px; border: 0; background: transparent; color: var(--fg); font: 400 16px/1 var(--font-mono); }
.box input.txt { font-family: var(--font-body); }
.box i { display: flex; align-items: center; padding: 0 12px 0 4px; font: 400 14px/1 var(--font-mono); font-style: normal; color: var(--muted); white-space: nowrap; }
.note input, .other textarea { width: 100%; border: 1px solid var(--rule-strong); background: var(--field); color: var(--fg); font: 400 16px/1.45 var(--font-body); }
.note input { height: 46px; padding: 0 12px; }
.other textarea { min-height: 120px; padding: 12px; resize: vertical; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.box:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.box input:focus-visible { outline: none; }
.bar { position: sticky; bottom: 0; margin-top: 36px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--rule-strong); }
.bar__text { display: grid; gap: 2px; min-width: 0; flex: 1 1 80px; }
@media (max-width: 560px) { .status { display: none; } }
.progress { font: 500 15px/1.3 var(--font-body); }
.status { font: 400 13px/1.3 var(--font-mono); color: var(--muted); }
.copy { display: inline-flex; align-items: center; text-decoration: none; min-height: 44px; padding: 0 18px; border: 1px solid var(--pressed-bg); background: var(--pressed-bg); color: var(--pressed-fg); font: 500 13px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; cursor: pointer; }
.copy--quiet { background: var(--field); color: var(--fg); border-color: var(--rule-strong); }
.after { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-top: 20px; }
.after__text { margin: 0; flex: 1 1 260px; min-width: 0; font-size: 14px; color: var(--muted); }
.copied { margin: 0; font-size: 14px; color: var(--muted); flex-basis: 100%; }
.copy-text { width: 100%; min-height: 160px; margin-top: 8px; padding: 10px; border: 1px solid var(--rule-strong); background: var(--field); color: var(--fg); font: 400 13px/1.5 var(--font-mono); }
.foot { margin: 0; padding-block: 18px 40px; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .seg button, .lang button { transition: none; } }
</style>

  }
  function getPath(o, path) { return path.split('.').reduce(function (a, p) { return a == null ? a : a[p]; }, o); }
  function setPath(o, path, v) { var ps = path.split('.'), last = ps.pop(), t = o; ps.forEach(function (p) { if (!t[p] || typeof t[p] !== 'object') t[p] = {}; t = t[p]; }); t[last] = v; }

  var $ = function (id) { return document.getElementById(id); };
  var t = function (k) { return (T[lang] && T[lang][k]) || T.en[k] || k; };
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (a) { if (a === 'text') n.textContent = attrs[a]; else n.setAttribute(a, attrs[a]); });
    (kids || []).forEach(function (k) { if (k) n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });
    return n;
  }

  /* ---------- building the form ---------- */
  function seg(key, field, values, labelKey) {
    var lab = el('span', { class: 'q__label', id: 'q-' + key + '-' + field, text: t(labelKey) });
    var group = el('div', { class: 'seg', role: 'group', 'aria-labelledby': 'q-' + key + '-' + field });
    values.forEach(function (v) { group.appendChild(el('button', { type: 'button', 'data-key': key, 'data-field': field, 'data-value': v[0], 'aria-pressed': 'false', text: t(v[1]) })); });
    return el('div', { class: 'q' }, [lab, group]);
  }
  /* tick boxes for the options, the first marked as the base of the % differences, and a line for an option of his own */
  function checks(key, options, qKey, phKey, baseFirst) {
    var lab = el('span', { class: 'q__label', id: 'q-' + key + '-offer', text: t(qKey) });
    var group = el('div', { class: 'checks', role: 'group', 'aria-labelledby': 'q-' + key + '-offer' });
    options.forEach(function (o, j) {
      group.appendChild(el('label', { class: 'check' }, [
        el('input', { type: 'checkbox', 'data-key': key, 'data-field': 'offer.' + o }),
        el('span', { text: t(o) }),
        baseFirst && j === 0 ? el('span', { class: 'base', text: t('base') }) : null
      ]));
    });
    return el('div', { class: 'q' }, [lab, group, input(key, 'own', t('own'), '', { text: true, placeholder: t(phKey) })]);
  }
  function input(key, field, label, unit, opts) {
    opts = opts || {};
    var id = 'f-' + key + '-' + field.replace(/\./g, '-');
    var inp = el('input', { id: id, 'data-key': key, 'data-field': field, inputmode: opts.text ? 'text' : 'decimal', autocomplete: 'off' });
    if (opts.text) inp.className = 'txt';
    if (opts.placeholder) inp.setAttribute('placeholder', opts.placeholder);
    var box = el('span', { class: 'box' }, [inp, unit ? el('i', { 'aria-hidden': 'true', text: unit }) : null]);
    var lab = el('span', { text: label });
    if (opts.labelFor) lab.setAttribute('data-own-label', opts.labelFor);
    return el('label', { class: 'field', for: id }, [lab, box]);
  }
  function note(key, labelKey) {
    var id = 'f-' + key + '-note';
    return el('label', { class: 'field note', for: id }, [el('span', { text: t(labelKey || 'note') }), el('input', { id: id, 'data-key': key, 'data-field': 'note', autocomplete: 'off' })]);
  }
  var YNU = [['yes', 'yes'], ['no', 'no'], ['unsure', 'unsure']];
  var YN = [['yes', 'yes'], ['no', 'no']];

  function build() {
    var form = $('form'); form.textContent = '';
    form.appendChild(el('div', { class: 'section-head' }, [el('h2', { text: '1. ' + t('s1') }), el('p', { class: 'section-sub', text: t('s1sub') })]));
    FACTORS.forEach(function (f, i) {
      var diffs = el('div', { class: 'fields', 'data-show': f.key + ':affects:yes' });
      f.options.slice(1).forEach(function (o) { diffs.appendChild(input(f.key, 'diff.' + o, t(o === 'traditional' ? 'traditionalShort' : o), '%', { placeholder: '+10' })); });
      var ownDiff = input(f.key, 'diff.own', t('own'), '%', { placeholder: '+10', labelFor: f.key });
      ownDiff.setAttribute('data-show-own', f.key);
      diffs.appendChild(ownDiff);
      form.appendChild(el('section', { class: 'item', 'data-item': f.key }, [
        el('h3', {}, [el('span', { class: 'num', text: '1.' + (i + 1) }), t(f.title)]),
        checks(f.key, f.options, 'offerQ', 'ph_' + f.key, true),
        seg(f.key, 'affects', YNU, 'changes'), diffs, note(f.key)
      ]));
    });

    form.appendChild(el('div', { class: 'section-head' }, [el('h2', { text: '2. ' + t('s2') }), el('p', { class: 'section-sub', text: t('s2sub') })]));
    var n = 0, head = function (titleKey, descKey) { n++; return el('div', {}, [el('h3', {}, [el('span', { class: 'num', text: '2.' + n }), t(titleKey)]), descKey ? el('p', { class: 'opts', text: t(descKey) }) : null]); };
    form.appendChild(el('section', { class: 'item', 'data-item': 'finish' }, [head('finish', 'finishDesc'),
      el('div', { class: 'fields' }, ['basic', 'standard', 'premium'].map(function (k) { return input('finish', 'prices.' + k, t(k), t('perm2')); })),
      seg('finish', 'ok', [['yes', 'yes'], ['no', 'changed']], 'right'), note('finish', 'finishNote')]));
    form.appendChild(el('section', { class: 'item', 'data-item': 'furniture' }, [head('furniture', 'furnitureDesc'),
      el('div', { class: 'fields' }, [input('furniture', 'pct', t('furniturePct'), '%')]),
      seg('furniture', 'ok', [['yes', 'yes'], ['no', 'changed']], 'right'), seg('furniture', 'kitchen', YNU, 'kitchen'), note('furniture')]));
    var ex = el('div', { class: 'fields' });
    EXTRAS.forEach(function (k) { ex.appendChild(input('extras', k + '.m2', t(k) + ' · ' + t('size'), t('m2'))); ex.appendChild(input('extras', k + '.share', t(k) + ' · ' + t('share'), '%')); });
    form.appendChild(el('section', { class: 'item', 'data-item': 'extras' }, [head('extras', 'extrasDesc'), checks('extras', EXTRAS, 'extrasQ', 'ph_extras', false),
      ex, seg('extras', 'ok', [['yes', 'yes'], ['no', 'changed']], 'right'), note('extras')]));
    form.appendChild(el('section', { class: 'item', 'data-item': 'design' }, [head('design', 'designDesc'), seg('design', 'free', YN, 'right'),
      el('div', { class: 'fields' }, [input('design', 'designOnly', t('designOnly'), '', { text: true, placeholder: t('designOnlyHint') })]), note('design')]));
    var ab = el('div', { class: 'fields', 'data-show': 'abroad:offer:yes' }, [
      input('abroad', 'kit', t('kit'), t('perm2')), input('abroad', 'container', t('container'), t('idr')), input('abroad', 'perContainer', t('perContainer'), t('m2')),
      input('abroad', 'supervision', t('supervision'), '%'), input('abroad', 'time', t('time'), '', { text: true })]);
    form.appendChild(el('section', { class: 'item', 'data-item': 'abroad' }, [head('abroad'), seg('abroad', 'offer', YNU, 'abroadQ'), ab,
      el('p', { class: 'hint', 'data-show': 'abroad:offer:no', text: t('abroadNo') }), note('abroad')]));
    form.appendChild(el('section', { class: 'item', 'data-item': 'site' }, [head('site'), seg('site', 'show', YN, 'siteQ'),
      el('div', { class: 'fields' }, [input('site', 'updateEvery', t('updateEvery'), '', { text: true })]), note('site')]));

    var oid = 'f-other-text';
    form.appendChild(el('div', { class: 'section-head' }, [el('h2', { text: '3. ' + t('s3') })]));
    form.appendChild(el('section', { class: 'item other', 'data-item': 'other' }, [
      el('label', { class: 'field', for: oid }, [el('span', { text: t('s3hint') }), el('textarea', { id: oid, 'data-key': 'other', 'data-field': 'text' })])]));

    ['eyebrow', 'title', 'lead', 'howto', 'foot', 'copyHint'].forEach(function (k) { $('t-' + k).textContent = t(k); });
    $('copy').textContent = t('copy'); $('send').textContent = t('send');
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    Object.keys(DEFAULTS).forEach(fill);
    renderStatus(); progress();
    if (localOnly) showBanner();
  }

  /* values into the form (never into the field being typed in) */
  function fill(key) {
    var s = state[key];
    Array.prototype.forEach.call(document.querySelectorAll('[data-key="' + key + '"]'), function (n) {
      var f = n.getAttribute('data-field'), v = getPath(s, f);
      if (n.tagName === 'BUTTON') n.setAttribute('aria-pressed', String(v === n.getAttribute('data-value')));
      else if (n.type === 'checkbox') n.checked = v === 'yes';
      else if (n !== document.activeElement) n.value = v == null ? '' : v;
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-show^="' + key + ':"]'), function (n) {
      var p = n.getAttribute('data-show').split(':'); n.hidden = getPath(s, p[1]) !== p[2];
    });
    /* the difference for his own option: only once he has named it, under its own name */
    var own = (s.own || '').trim();
    Array.prototype.forEach.call(document.querySelectorAll('[data-show-own="' + key + '"]'), function (n) { n.hidden = !own; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-own-label="' + key + '"]'), function (n) { n.textContent = own || t('own'); });
  }
  function answered() { return Object.keys(ANSWER_FIELD).filter(function (k) { return !!state[k][ANSWER_FIELD[k]]; }).length; }
  function progress() { $('progress').textContent = t('progress').replace('{n}', answered()).replace('{total}', TOTAL); }

  /* ---------- saving ---------- */
  var db = null, localOnly = false, statusKey = 'local', dirty = {}, inflight = {}, again = {}, timers = {};
  function setStatus(k) { statusKey = k; renderStatus(); }
  function renderStatus() { $('status').textContent = t('st_' + statusKey); }
  function showBanner() { var b = $('banner'); b.textContent = t('banner'); b.hidden = false; }
  function saveDraft() { try { localStorage.setItem('bg-price-factors-draft', JSON.stringify(state)); } catch (e) {} }
  function busy() { return Object.keys(timers).some(function (k) { return timers[k]; }) || Object.keys(inflight).some(function (k) { return inflight[k]; }); }

  function changed(key) {
    dirty[key] = true; saveDraft(); progress();
    if (localOnly || !db) { setStatus(db === null && !connecting ? 'local' : statusKey); return; }
    setStatus('saving');
    clearTimeout(timers[key]); timers[key] = setTimeout(function () { timers[key] = null; flush(key); }, 700);
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function write(key, body) { return db.doc('answers/' + key).set(body); }
  function flush(key) {
    if (inflight[key]) { again[key] = true; return; }
    inflight[key] = true; dirty[key] = false;
    var body = clone(state[key]); body.t = new Date().toISOString();
    write(key, body).catch(function (e) {
      if (e && e.code === 'unavailable') return wait(600 + Math.random() * 900).then(function () { return write(key, body); });
      throw e;
    }).then(function () {
      inflight[key] = false;
      if (again[key]) { again[key] = false; flush(key); return; }
      if (!busy()) setStatus('saved');
    }, function (e) {
      inflight[key] = false; dirty[key] = true;
      var code = e && e.code;
      if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked' || code === 'capability_disabled' || code === 'capability_removed') { localOnly = true; showBanner(); setStatus('local'); }
      else setStatus('error');
    });
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var lb = e.target.closest('[data-lang]');
    if (lb) { lang = lb.getAttribute('data-lang'); try { localStorage.setItem('bg-price-factors-lang', lang); } catch (x) {} build(); return; }
    var b = e.target.closest('button[data-key]');
    if (!b) return;
    var key = b.getAttribute('data-key'), f = b.getAttribute('data-field'), v = b.getAttribute('data-value');
    setPath(state[key], f, getPath(state[key], f) === v ? '' : v); // a second tap clears the answer
    fill(key); changed(key);
  });
  function onField(e) {
    var n = e.target; if (!n.getAttribute || !n.getAttribute('data-key')) return;
    var key = n.getAttribute('data-key'), f = n.getAttribute('data-field');
    var v = n.type === 'checkbox' ? (n.checked ? 'yes' : '') : str(n.value);
    if (getPath(state[key], f) === v) return; // a checkbox fires both input and change
    setPath(state[key], f, v);
    if (n.type === 'checkbox' || f === 'own') fill(key);
    changed(key);
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', onField);

  /* ---------- copy ---------- */
  function sign(v) { v = str(v).trim(); if (!v) return ''; return /^[+\-−]/.test(v) ? v : (/^0+([.,]0+)?$/.test(v) ? v : '+' + v); }
  function pctOf(v) { var d = sign(v); return d ? d + (d.slice(-1) === '%' ? '' : '%') : ''; }
  function yn(v) { return v === 'yes' ? t('yes') : v === 'no' ? t('no') : v === 'unsure' ? t('unsure') : t('txtNot'); }
  function offered(key, options, shortName) {
    var s = state[key], names = options.filter(function (o) { return s.offer[o] === 'yes'; }).map(shortName);
    var own = (s.own || '').trim(); if (own) names.push(own + ' (' + t('txtOwn') + ')');
    return t('txtOffer') + ': ' + (names.length ? names.join(', ') : t('txtNone'));
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function short(o) { return t(o === 'traditional' ? 'traditionalShort' : o); }
  function text() {
    var out = [t('txtHead') + ' (' + new Date().toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-GB') + ')', ''];
    FACTORS.forEach(function (f, i) {
      var s = state[f.key], line = '1.' + (i + 1) + ' ' + t(f.title) + '. ' + offered(f.key, f.options, short) + '. ';
      if (s.affects === 'yes') {
        var parts = f.options.slice(1).map(function (o) { var d = pctOf(s.diff[o]); return d ? short(o) + ' ' + d : ''; });
        var own = (s.own || '').trim(), od = pctOf(s.diff.own);
        if (own && od) parts.push(own + ' ' + od);
        parts = parts.filter(Boolean);
        line += cap(t('txtChanges')) + (parts.length ? ': ' + parts.join(', ') : '');
      } else line += cap(s.affects === 'no' ? t('txtNoChange') : s.affects === 'unsure' ? t('txtUnsure') : t('txtNot'));
      if (s.note) line += '. ' + t('txtNote') + ': ' + s.note;
      out.push(line);
    });
    var F = state.finish, ok = function (v) { return v === 'yes' ? t('txtRight') : v === 'no' ? t('txtWrong') : t('txtNot'); };
    out.push('2.1 ' + t('finish') + ': ' + ok(F.ok) + '. ' + t('basic') + ' ' + F.prices.basic + ', ' + t('standard') + ' ' + F.prices.standard + ', ' + t('premium') + ' ' + F.prices.premium + ' ' + t('perm2') + (F.note ? '. ' + t('txtNote') + ': ' + F.note : ''));
    var U = state.furniture;
    out.push('2.2 ' + t('furniture') + ': ' + ok(U.ok) + ', ' + U.pct + '%. ' + t('kitchen') + ' ' + yn(U.kitchen) + (U.note ? '. ' + t('txtNote') + ': ' + U.note : ''));
    var E = state.extras;
    out.push('2.3 ' + t('extras') + '. ' + offered('extras', EXTRAS, function (k) { return t(k); }) + '. ' + cap(ok(E.ok)) + ': ' + EXTRAS.map(function (k) { return t(k) + ' ' + E[k].m2 + ' m², ' + E[k].share + '%'; }).join('; ') + (E.note ? '. ' + t('txtNote') + ': ' + E.note : ''));
    var D = state.design;
    out.push('2.4 ' + t('design') + ': ' + t('designDesc') + ' ' + cap(yn(D.free)) + (D.designOnly ? '. ' + t('designOnly') + ': ' + D.designOnly : '') + (D.note ? '. ' + t('txtNote') + ': ' + D.note : ''));
    var A = state.abroad, al = '2.5 ' + t('abroad') + ': ' + yn(A.offer);
    if (A.offer === 'yes') al += '. ' + [[t('kit'), A.kit], [t('container'), A.container], [t('perContainer'), A.perContainer], [t('supervision'), A.supervision], [t('time'), A.time]].filter(function (p) { return p[1]; }).map(function (p) { return p[0] + ' ' + p[1]; }).join('; ');
    if (A.note) al += '. ' + t('txtNote') + ': ' + A.note;
    out.push(al);
    var S = state.site;
    out.push('2.6 ' + t('site') + ': ' + yn(S.show) + (S.updateEvery ? '. ' + t('updateEvery') + ' ' + S.updateEvery : '') + (S.note ? '. ' + t('txtNote') + ': ' + S.note : ''));
    if (state.other.text) { out.push(''); out.push('3. ' + t('txtOther') + ': ' + state.other.text); }
    return out.join('\n');
  }
  $('copy').addEventListener('click', function () {
    var s = text(), done = $('copied'), area = $('copy-text');
    var fallback = function () { area.value = s; area.hidden = false; area.focus(); area.select(); done.textContent = t('copyFail'); done.hidden = false; };
    try {
      navigator.clipboard.writeText(s).then(function () { area.hidden = true; done.textContent = t('copied'); done.hidden = false; }, fallback);
    } catch (e) { fallback(); }
  });

  /* ---------- sending ---------- */
  /* wa.me with only a text opens WhatsApp and lets him pick the chat to send it to */
  $('send').addEventListener('click', function () { this.href = 'https://wa.me/?text=' + encodeURIComponent(text()); });
  var connecting = false;
  build();
  setStatus('local');
})();
</script>
</body>
