# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Bali Gedeg — Design & Build: site editor configuration (Sveltia CMS).
# Published by `node tools/cms/publish-admin.mjs` from cms/config.yml, which is generated by `node tools/cms/build-config.mjs` from tools/cms/schema.mjs. Do not edit by hand.

backend:
  # The private repository with the site. Sign-in with a fine-grained access token that can only
  # read and write this repository (GitHub OAuth needs an authenticator service, not set up yet).
  name: github
  repo: "baligedeg/baligedeg-site"
  branch: main
  auth_methods: [token]
logo_url: "emblem.png"
media_folder: "src/assets/photos"
public_folder: "/src/assets/photos"
media_libraries:
  all:
    max_file_size: 26214400
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2560
        height: 2560
output:
  omit_empty_optional_fields: true
editor:
  preview: false

collections:
  - name: home
    label: "Главная"
    icon: home
    description: "Тексты и фото главной сверху вниз, как на сайте. EN обязательно; пустые RU и ID сайт заменит английским."
    files:
      - name: home
        label: "Главная страница"
        file: "src/content/pages/home.json"
        format: json
        media_folder: "/src/assets/photos/site"
        public_folder: "/src/assets/photos/site"
        fields:
          - name: hero
            label: "Первый экран"
            widget: object
            fields:
              - name: title
                label: "Заголовок"
                widget: object
                fields:
                  - name: line1
                    label: "Строка 1"
                    widget: object
                    fields:
                      - name: en
                        label: EN
                        widget: string
                      - name: ru
                        label: RU
                        widget: string
                        required: false
                      - name: id
                        label: ID
                        widget: string
                        required: false
                  - name: line2
                    label: "Строка 2"
                    widget: object
                    fields:
                      - name: en
                        label: EN
                        widget: string
                      - name: ru
                        label: RU
                        widget: string
                        required: false
                      - name: id
                        label: ID
                        widget: string
                        required: false
              - name: lead
                label: "Подзаголовок"
                widget: object
                hint: "Абзац под заголовком. В тексте есть HTML: `&amp;` — это знак &, `&nbsp;` — неразрывный пробел. Меняйте только слова."
                fields:
                  - name: en
                    label: EN
                    widget: text
                  - name: ru
                    label: RU
                    widget: text
                    required: false
                  - name: id
                    label: ID
                    widget: text
                    required: false
              - name: cta_secondary
                label: "Кнопка «Смотреть проекты»"
                widget: object
                hint: "Кнопка «Записаться на консультацию» рядом с ней — в разделе «Общие тексты»."
                fields:
                  - name: en
                    label: EN
                    widget: string
                  - name: ru
                    label: RU
                    widget: string
                    required: false
                  - name: id
                    label: ID
                    widget: string
                    required: false
              - name: slides
                label: "Слайды первого экрана"
                label_singular: "слайд"
                widget: list
                hint: "От 1 до 8 фото. Порядок на сайте — как в списке. Меняйте стрелками ↑ ↓; на компьютере можно перетащить за значок ═."
                min: 1
                max: 8
                summary: "{{caption.en}}"
                thumbnail: image
                collapsed: true
                fields:
                  - name: image
                    label: "Фото"
                    widget: image
                    hint: "JPG, PNG, WebP или HEIC с iPhone, до 25 МБ. При загрузке фото сохраняется в WebP, большое — уменьшается до 2560 px по длинной стороне."
                    choose_url: false
                    media_folder: "/src/assets/photos/hero"
                    public_folder: "/src/assets/photos/hero"
                  - name: image_mobile
                    label: "Фото для телефона"
                    widget: image
                    required: false
                    hint: "Необязательно. Отдельный вертикальный кадр (4:5 или 9:16). Если пусто, телефон показывает основное фото."
                    choose_url: false
                    media_folder: "/src/assets/photos/hero"
                    public_folder: "/src/assets/photos/hero"
                  - name: focus
                    label: "Фокус на компьютере"
                    widget: select
                    required: false
                    hint: "Какую часть фото сохранить, когда рамка обрезает его на компьютере. Если не выбрано — центр."
                    options:
                      - label: "Центр"
                        value: center
                      - label: "Верх"
                        value: top
                      - label: "Низ"
                        value: bottom
                      - label: "Лево"
                        value: left
                      - label: "Право"
                        value: right
                      - label: "Верх-лево"
                        value: top-left
                      - label: "Верх-право"
                        value: top-right
                      - label: "Низ-лево"
                        value: bottom-left
                      - label: "Низ-право"
                        value: bottom-right
                  - name: focus_mobile
