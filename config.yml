                        widget: string
                      - name: ru
                        label: RU
                        widget: string
                        required: false
                      - name: id
                        label: ID
                        widget: string
                        required: false
                  - name: caption
                    label: "Подпись"
                    widget: object
                    required: false
                    hint: "Необязательно. Подпись под фото, если она нужна в этом месте."
                    fields:
                      - name: en
                        label: EN
                        widget: string
                      - name: ru
                        label: RU
                        widget: string
                        required: false
                      - name: id
                        label: ID
                        widget: string
