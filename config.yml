                      - label: "Верх"
                        value: top
                      - label: "Низ"
                        value: bottom
                      - label: "Лево"
                        value: left
                      - label: "Право"
                        value: right
                      - label: "Верх-лево"
                        value: top-left
                      - label: "Верх-право"
                        value: top-right
                      - label: "Низ-лево"
